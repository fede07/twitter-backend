name: CI Pipeline

on:
  push:
    branches:
      - tasks/11-unit-tests
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Change working directory
      - run cd node/express-prisma-typescript

      - name: Install dependencies
        working-directory: ./express-prisma-typescript
        run: yarn install

      - name: Run tests
        working-directory: ./express-prisma-typescript
        run: yarn test
